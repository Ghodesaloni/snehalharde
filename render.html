## Comprehensive Technical Specification, System Architecture & Algorithmic Documentation

---

# Executive Summary

**AvaHire** is an enterprise-grade, autonomous, multimodal Artificial Intelligence recruitment platform and Applicant Tracking System (ATS). It streamlines the talent acquisition lifecycle by combining deterministic parsing and scoring algorithms with conversational generative AI and real-time WebRTC media streaming.

The system replaces manual recruitment workflows by automating:
1. **Multi-format Resume Parsing & Entity Extraction** from unstructured PDF, DOCX, and RTF documents.
2. **Deterministic 8-Factor ATS Resume-to-Job Matching** to eliminate screening bias and hallucination.
3. **Automated Candidate Lifecycle & Email Orchestration** across shortlisting, scheduling, 1-hour pre-interview reminders, and offer generation.
4. **Autonomous Multimodal Live AI Interviews** featuring a photorealistic 2D avatar ("Ava"), sub-second voice-to-voice interaction via WebRTC and Google Gemini Realtime, and real-time audio/visual anti-cheating proctoring.
5. **Structured 5-Parameter Evaluation & Scoring** generating instant hiring intelligence, transcripts, and scorecards for HR teams.

---

# 1. Project Overview

## 1.1 What AvaHire Is
AvaHire is a full-stack AI recruitment platform architected with a React 19 single-page application (SPA), an Express.js backend runtime, a dual-layer PostgreSQL/JSON persistence engine, LiveKit WebRTC media routing, and Python agent workers powering real-time conversational avatars.

## 1.2 Main Objective of the System
The primary objective of AvaHire is to accelerate hiring velocity from weeks to hours while enforcing standardized, bias-free technical evaluations. It guarantees that every applicant is evaluated against identical rubric criteria tailored directly to the specific job requisition.

## 1.3 Problems Solved by the System
* **Recruiter Screening Fatigue:** Automates the initial evaluation of thousands of resumes using deterministic algorithms.
* **Scheduling Inefficiencies:** Eliminates manual email coordination via automated, tokenized calendar link generation and proactive background reminders.
* **Subjective & Unstructured Interviews:** Standardizes technical interviews using dynamic, project-specific question pipelines.
* **Remote Interview Fraud:** Mitigates unauthorized assistance, surrogate test-takers, and parallel browser tab cheating using real-time audio and computer vision proctoring algorithms.
* **Recruitment Feedback Latency:** Automatically generates scored interview transcripts and hiring recommendations upon interview completion.

# 3. Frontend Architecture

The frontend is constructed with React 19, structured around a modular component architecture:

```
src/
├── App.jsx                     # Route definitions & global context providers
├── index.css                   # Tailwind CSS imports & global styles
├── components/
│   ├── DashboardLayout.jsx     # Authenticated HR navigation wrapper
│   └── ui/                     # Radix UI design primitives
├── context/
│   └── AuthContext.jsx         # Authentication & user state management
├── pages/
│   ├── auth/                   # Login, Register, Forgot Password
│   ├── dashboard/              # HR Views: Jobs, Candidates, Resumes, Interviews, Calendar, Settings
│   └── candidate/
│       ├── CandidatePortalPage.jsx   # Candidate verification & pre-interview join gate
│       ├── CandidateLiveRoom.jsx     # Live WebRTC room, Avatar feed, and Proctoring engine
│       ├── CandidateThankYou.jsx     # Post-interview conclusion & termination screen
│       └── liveavatar/my-agent/      # LiveKit Python agent worker subsystem
└── utils/
    └── api.js                  # Centralized HTTP client with JWT interceptor
```

### Key Frontend Subsystems
1. **Full-Screen Enforcement:** [`CandidateLiveRoom.jsx`](file:///c:/Users/Asus/OneDrive/Desktop/MAJOR%20PROJECT/New%20folder/snehalharde/src/pages/candidate/CandidateLiveRoom.jsx) requests full-screen mode via `document.documentElement.requestFullscreen()` and attaches listeners to `fullscreenchange` and `visibilitychange`.
2. **Audio Signal Processing:** Configures a browser `AudioContext` with an `AnalyserNode` (`fftSize = 2048`) to sample microphone frequency domain data in real time.
3. **Web Speech Transcription:** Continuously captures candidate speech using `window.webkitSpeechRecognition` to provide live captioning and transcript backup.
4. **Computer Vision Canvas Loop:** Uses an off-screen HTML5 `<canvas>` to sample video frames at 1 Hz for luminance validation and face clustering.

# 5. Database Architecture

## 5.1 Dual-Layer Persistence Engine
AvaHire implements a resilient dual-layer database architecture in [`server/db/dbEngine.js`](file:///c:/Users/Asus/OneDrive/Desktop/MAJOR%20PROJECT/New%20folder/snehalharde/server/db/dbEngine.js):
* **PostgreSQL Layer:** Manages relational integrity across 13 core tables.
* **JSON Document Layer:** Maintains serialized JSON files under `server/data/` as a live mirror. If PostgreSQL connectivity is interrupted, the system fails over to the local JSON store with zero downtime.

# 8. ATS Algorithm Formulation

```
Total ATS Score = S_req + S_pref + S_exp + S_edu + S_kw + S_dom + S_qual + S_cert
```

### Mathematical Definitions

$$\text{Total ATS Score} = S_{\text{req}} + S_{\text{pref}} + S_{\text{exp}} + S_{\text{edu}} + S_{\text{kw}} + S_{\text{dom}} + S_{\text{qual}} + S_{\text{cert}}$$

#### 1. Required Skills Match ($S_{\text{req}}$, Max 30 Points)
$$S_{\text{req}} = \left( \frac{N_{\text{matched\_required}}}{N_{\text{total\_required}}} \right) \times 30.0$$

#### 2. Preferred Skills Match ($S_{\text{pref}}$, Max 10 Points)
$$S_{\text{pref}} = \left( \frac{N_{\text{matched\_preferred}}}{N_{\text{total\_preferred}}} \right) \times 10.0$$
*(Defaults to 8.0 points if no preferred skills are listed in the JD)*

#### 3. Professional Experience ($S_{\text{exp}}$, Max 20 Points)
Let $R_{\text{exp}} = \frac{\text{Years}_{\text{candidate}}}{\text{Years}_{\text{required}}}$.
$$S_{\text{exp}} = \begin{cases}
20.0 & \text{if } R_{\text{exp}} \ge 1.0 \\
\max(6.0, R_{\text{exp}} \times 20.0) & \text{if } R_{\text{exp}} < 1.0 \text{ and } \text{Years}_{\text{required}} > 0 \\
16.0 & \text{if } \text{Years}_{\text{required}} = 0 \text{ (Entry Level)}
\end{cases}$$

#### 4. Education Qualification ($S_{\text{edu}}$, Max 10 Points)
$$S_{\text{edu}} = \begin{cases}
10.0 & \text{PhD / Doctorate} \\
9.5 & \text{Master's / M.Tech / MBA / MS} \\
9.0 & \text{Bachelor's / B.Tech / B.E. / BS} \\
7.5 & \text{Diploma / Associate Degree} \\
5.0 & \text{No Degree Detected}
\end{cases}$$

#### 5. Industry Keywords & Methodologies ($S_{\text{kw}}$, Max 10 Points)
$$S_{\text{kw}} = \min\left(1.0, \max\left(0.4, \frac{N_{\text{matched\_keywords}}}{4}\right)\right) \times 10.0$$

#### 6. Domain Alignment ($S_{\text{dom}}$, Max 10 Points)
$$S_{\text{dom}} = \begin{cases}
10.0 & \text{if Primary Domain matches Job Domain} \\
8.5 & \text{if Secondary Domain matches Job Domain} \\
\max\left(5.0, 5.0 + 4.0 \times \frac{N_{\text{matched\_required}}}{N_{\text{total\_required}}}\right) & \text{if Cross-domain alignment}
\end{cases}$$

#### 7. Resume Quality & Document Health ($S_{\text{qual}}$, Max 5 Points)
Base score is $5.0$ with heuristic deductions:
* Missing Email: $-1.0$
* Missing Phone: $-0.5$
* Low Skill Density ($< 3$ skills): $-1.0$
* Missing Experience Section: $-1.0$
* Scanned PDF / Low Text Density ($< 50$ alphanumeric characters): $-2.0$
* Result is bounded: $S_{\text{qual}} \in [1.0, 5.0]$

#### 8. Technical Certifications ($S_{\text{cert}}$, Max 5 Points)
$$S_{\text{cert}} = \begin{cases}
5.0 & \text{if } N_{\text{certifications}} \ge 2 \\
4.0 & \text{if } N_{\text{certifications}} = 1 \\
2.0 & \text{if } N_{\text{certifications}} = 0
\end{cases}$$

### Decision Threshold Rules
* **Shortlisted:** $\text{Total ATS Score} \ge 75.0 \quad \text{AND} \quad \frac{N_{\text{matched\_required}}}{N_{\text{total\_required}}} \ge 0.60$
* **Rejected:** $\text{Total ATS Score} < 50.0 \quad \text{OR} \quad \frac{N_{\text{matched\_required}}}{N_{\text{total\_required}}} < 0.35$
* **Under Review:** Intermediate scores ($50.0 \le \text{Score} < 75.0$).

# 10. Interview Scoring Rubric

Candidate responses are scored per question ($S_i$) across 5 weighted dimensions:

$$\text{Question Score } (S_i) = (S_{\text{tech}} \times 0.40) + (S_{\text{comp}} \times 0.25) + (S_{\text{rel}} \times 0.15) + (S_{\text{ps}} \times 0.15) + (S_{\text{clarity}} \times 0.05)$$

| Rubric Dimension | Weight | Description |
| :--- | :--- | :--- |
| **Technical Correctness** ($S_{\text{tech}}$) | **40%** | Accurate technical principles, architectural patterns, and syntax logic. |
| **Completeness** ($S_{\text{comp}}$) | **25%** | Addressing all sub-parts of the question thoroughly. |
| **Relevance** ($S_{\text{rel}}$) | **15%** | Direct adherence to the question without digression. |
| **Problem Solving** ($S_{\text{ps}}$) | **15%** | Structured analytical reasoning, edge-case awareness, and trade-off analysis. |
| **Communication Clarity** ($S_{\text{clarity}}$) | **5%** | Concise, articulate delivery of complex engineering concepts. |

### Final Interview Score & Recommendation
$$\text{Overall Score} = \frac{1}{N} \sum_{i=1}^{N} S_i$$

* **Selected:** $\text{Overall Score} \ge 80.0$
* **Under Review:** $65.0 \le \text{Overall Score} < 80.0$
* **Rejected:** $\text{Overall Score} < 65.0$

# 12. Anti-Cheating & Proctoring Mechanisms

| Anti-Cheating Vector | Detection Method | Trigger Condition | Warning Action | Final Action | Data Logged |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Tab Switch / Window Blur** | DOM `visibilitychange` & `window.onblur` | Candidate switches tab or minimizes window | Zero-tolerance: Instant trigger | Immediate interview termination | Violation type, exit timestamp, disqualified status |
| **Full-Screen Exit** | DOM `fullscreenchange` | Exiting full-screen mode | Instant trigger | Immediate interview termination | Exit timestamp, violation record |
| **Multiple Faces in View** | Chromium `FaceDetector` & Skin Centroid Clustering | $\ge 2$ distinct faces detected in frame | Visual & verbal warning incremented | On 3rd warning ($W \ge 3$), meeting terminated | Warning count, timestamp, video snapshot flag |
| **Face Not Detected** | Skin-pixel centroid variance | Face missing for $> 5$ consecutive seconds | Visual prompt: "Please face the camera" | Non-terminating warning | Warning log |
| **Poor Lighting / Glare** | Perceived Luminance ($Y < 35 \lor Y > 230$) | Frame underexposed or overexposed | Visual alert: "Adjust room lighting" | Non-terminating warning | Status record |
| **Multiple Background Voices** | Web Audio API FFT Harmonic Peak Detection | Secondary distinct vocal formant detected $> 2.5\text{s}$ | Verbal warning from avatar | On 3rd warning ($W \ge 3$), meeting terminated | Audio anomaly log, warning count |

    document.addEventListener('DOMContentLoaded', async () => {
      const rawMd = document.getElementById('raw-markdown').textContent;
      
      // Configure marked
      marked.setOptions({
        gfm: true,
        breaks: false,
        headerIds: true,
        mangle: false,
        highlight: function(code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            try {
              return hljs.highlight(code, { language: lang }).value;
            } catch (__) {}
          }
          return hljs.highlightAuto(code).value;
        }
      });

      // Render markdown to HTML
      const rawHtml = marked.parse(rawMd);
      const contentEl = document.getElementById('content');
      contentEl.innerHTML = rawHtml;

      // Transform mermaid code blocks to mermaid containers
      const codeBlocks = document.querySelectorAll('pre code.language-mermaid, pre code.lang-mermaid');
      codeBlocks.forEach((codeEl, index) => {
        const preEl = codeEl.closest('pre');
        const mermaidCode = codeEl.textContent;
        const container = document.createElement('div');
        container.className = 'mermaid-container';
        const mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.textContent = mermaidCode;
        container.appendChild(mermaidDiv);
        preEl.parentNode.replaceChild(container, preEl);
      });

      // Initialize mermaid
      mermaid.initialize({
        startOnLoad: false,
        theme: 'neutral',
        fontFamily: 'Inter, sans-serif',
        themeVariables: {
          primaryColor: '#e0f2fe',
          primaryTextColor: '#0369a1',
          primaryBorderColor: '#0284c7',
          lineColor: '#475569',
          secondaryColor: '#f1f5f9',
          tertiaryColor: '#ffffff'
        },
        flowchart: {
          curve: 'basis',
          htmlLabels: true
        },
        er: {
          useMaxWidth: true
        },
        sequence: {
          useMaxWidth: true,
          showSequenceNumbers: true
        }
      });

      try {
        await mermaid.run({
          nodes: document.querySelectorAll('.mermaid')
        });
      } catch (err) {
        console.error('Mermaid render error:', err);
      }

      // Render KaTeX math
      renderMathInElement(contentEl, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });

      // Add section breaks for major chapters for clean printing
      const majorHeadings = document.querySelectorAll('h1');
      majorHeadings.forEach((h, idx) => {
        if (idx > 1) { // Skip title and executive summary
          h.classList.add('section-break');
        }
      });

      // Mark ready for puppeteer / CDP
      window.__RENDER_COMPLETE = true;
      console.log('Rendering completed successfully!');
    });
  </script>
</body>
</html>
