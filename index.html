    <script>
      window.addEventListener("error", function (e) {
        if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
        if (e.message && (e.message.includes("Failed to construct 'WebSocket'") || e.message.includes(":NaN/ws"))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
